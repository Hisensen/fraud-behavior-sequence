body{margin:0; background:var(--bg); color:var(--ink);

.badge.syn{border-color:var(--warn); color:var(--warn); background:var(--warn-soft)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0}
.chip{background:var(--code-bg); border:1px solid var(--line); border-radius:7px;

.chip.good .v{color:var(--normal)} .chip.bad .v{color:var(--fraud)}
h3{font-size:14px; margin:14px 0 6px; font-family:inherit; font-weight:700}
table{border-collapse:collapse; width:100%; font-size:12.5px}
.tbl-wrap{overflow-x:auto; max-height:240px; overflow-y:auto; margin:6px 0}
th{text-align:left; font-weight:600; color:var(--ink3); font-size:11px;

td{border-bottom:1px solid var(--line); padding:4px 10px 4px 0; vertical-align:top}
td.m{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; white-space:nowrap}
.verdict{border-left:3px solid var(--normal); background:var(--normal-soft);

.verdict.bad{border-left-color:var(--fraud); background:var(--fraud-soft)}
.verdict.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.pipe{font-size:12.5px; color:var(--ink2); background:var(--code-bg);

.foot{margin-top:50px; border-top:1px solid var(--line); padding-top:12px;

strong{font-weight:600}

    fieldsHtml = "<table><tr><th>字段</th><th>含义</th></tr>" + fieldsHtml + "</table>";
  } else if (raw.cols){
    fieldsHtml = raw.cols.map(function(c){
      return "<tr><td class='m'>" + c.name + "</td><td class='m'>" + c.ex + "</td></tr>";
    }).join("");
    fieldsHtml = "<table><tr><th>列名(共" + raw.cols.length + "列)</th><th>真实示例值</th></tr>" + fieldsHtml + "</table>";
  }
  var chips = d.scale.map(function(s){
    return "<div class='chip'><div class='v'>" + s[0] + "</div><div class='k'>" + s[1] + "</div></div>";
  }).join("");
  var res = d.res.map(function(r){
    return "<div class='chip " + (r[2]||"") + "'><div class='v'>" + r[0] + "</div><div class='k'>" + r[1] + "</div></div>";
  }).join("");

  var sec = document.createElement("div");
  sec.className = "ds"; sec.id = d.id;
  sec.innerHTML =
    "<div class='ds-head'><h2>" + d.name + "</h2>" +
    "<span class='badge " + (d.tag === "real" ? "real" : "syn") + "'>" + d.tagTxt + "</span>" +
    "<span class='badge'>" + d.shape + "</span>" +
    "<span class='badge'>" + d.src + "</span></div>" +
    "<div class='chips'>" + chips + "</div>" +
    "<p style='font-size:13.5px; color:var(--ink2)'><strong>任务/信号设计：</strong>" + d.task + "</p>" +
    "<h3>字段清单</h3><div class='tbl-wrap'>" + fieldsHtml + "</div>" +
    "<h3>原始数据原文（未做任何处理）</h3><pre>" +
    raw.sample.replace(/</g,"&lt;") + "</pre>" +
    "<h3>处理链路</h3><div class='pipe'>" + d.pipe + "</div>" +
    "<h3>结果</h3><div class='chips'>" + res + "</div>" +
    "<div class='verdict " + (d.verdict[0]==="good"?"":d.verdict[0]) + "'>" + d.verdict[1] + "</div>";
  root.appendChild(sec);
});
</script>
